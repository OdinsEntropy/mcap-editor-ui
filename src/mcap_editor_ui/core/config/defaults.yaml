# Default settings of mcap_editor_ui. Do not edit this file to change your settings: user overrides go to
# ~/.config/mcap_editor_ui/settings.yaml (written by the settings dialog of the browser UI; only values that differ from here).

interface:
  accent: orange          # orange, teal, blue, violet, green
  theme: system           # system, dark, light

sizes:
  unit: smart             # smart (file < 1 GB → kB, < 100 GB → MB, else GB), kB, MB, GB, auto (per value)

output:
  suffix: _edit           # default output name: <input><suffix>.mcap next to the input
  keep_latched: true      # copy latched messages from before the start
  compression: keep       # keep (as input), zstd, lz4, none
  split: "off"            # off, duration, size
  split_duration_s: 60.0  # length of one part when splitting by duration
  split_size_gb: 1.0      # size of one part when splitting by size
  split_repeat_latched: true   # latched messages at the start of every part (false: only part 0)

editing:
  history_size: 20        # undo steps in the browser UI

ui:
  port: 8780              # port on 127.0.0.1; takes effect at the next start
