[project]
name = "mcap-editor-ui"
version = "0.1.0"
description = "Cut, filter and split MCAP recordings of any size, with a browser UI, a terminal UI or plain CLI commands."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric Pohl" }]
requires-python = ">=3.10"
dependencies = [
    "mcap>=1.2",
    "zstandard>=0.22",
    "lz4>=4.3",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "numpy>=2.2.6",
]

[project.scripts]
mcap-editor = "mcap_editor_ui.cli.main:main"
mcap-editor-ui = "mcap_editor_ui.cli.main:ui_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcap_editor_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
